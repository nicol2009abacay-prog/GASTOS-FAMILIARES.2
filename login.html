<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Gastos Familiares</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff1f7;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 350px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #d6297b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #e9368f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #d6297b;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>💰 Gastos Familiares</h1>
    <p style="text-align:center; color:#888; font-size:13px; margin-top:-10px;">Proyecto educativo · Técnico Medio en Sistemas Informáticos</p>
    <form id="loginForm">

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        required
        placeholder="correo@ejemplo.com"
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        required
        placeholder="Contraseña"
      >
       <button type="submit" id="btnEntrar">Iniciar sesión</button>

<p id="toggleTexto" style="text-align:center; margin-top:15px;">
  ¿No tienes cuenta? <a href="#" id="toggleLink">Regístrate aquí</a>
</p>
    </form>

    <p id="mensaje"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>

<script>
  const form = document.getElementById("loginForm");
  const mensaje = document.getElementById("mensaje");
  const btnEntrar = document.getElementById("btnEntrar");
  const toggleTexto = document.getElementById("toggleTexto");

  let modoRegistro = false;

  toggleTexto.addEventListener("click", (e) => {
    if (e.target.id !== "toggleLink") return;
    e.preventDefault();
    modoRegistro = !modoRegistro;

    if (modoRegistro) {
      btnEntrar.textContent = "Registrarme";
      toggleTexto.innerHTML = '¿Ya tienes cuenta? <a href="#" id="toggleLink">Inicia sesión aquí</a>';
    } else {
      btnEntrar.textContent = "Iniciar sesión";
      toggleTexto.innerHTML = '¿No tienes cuenta? <a href="#" id="toggleLink">Regístrate aquí</a>';
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    mensaje.textContent = modoRegistro ? "Registrando..." : "Iniciando sesión...";

    const { data, error } = modoRegistro
      ? await registrar(email, password)
      : await iniciarSesion(email, password);

    if (error) {
      mensaje.textContent = "❌ " + error.message;
      return;
    }

    mensaje.textContent = modoRegistro ? "✅ Cuenta creada" : "✅ Sesión iniciada";
    window.location.href = "index.html";
  });
</script>

</body>
</html>
